# Generate the Xcode project with: xcodegen generate   (brew install xcodegen)
name: BlooperRemote
options:
  bundleIdPrefix: com.blooper
  deploymentTarget:
    iOS: "17.0"
targets:
  BlooperRemote:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blooper.remote
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      path: BlooperRemote.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Blooper Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBonjourServices: ["_blooper._tcp"]
        NSLocalNetworkUsageDescription: Connects to your paired Blooper computer on the same Wi-Fi network.
        NSMicrophoneUsageDescription: Records your spoken request when you tap Speak.
        NSSpeechRecognitionUsageDescription: Turns your spoken request into text on this phone.
        NSCameraUsageDescription: Scans the pairing and enrollment QR codes shown by Blooper.
        NSFaceIDUsageDescription: Confirms it is you before approving an action on your computer.
        # Plain HTTP is allowed only for local-network hosts (IP addresses, .local names).
        # Anything else, including a tailnet name, must be HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
